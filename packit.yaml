# Enable RPM builds and running integration tests in PRs through https://packit.dev/
# To use this, enable Packit-as-a-service in GitHub: https://packit.dev/docs/packit-as-a-service/
# See https://packit.dev/docs/configuration/ for the format of this file

specfile_path: cockpit-cron.spec
# use the nicely formatted release description from our upstream release, instead of git shortlog
copy_upstream_release_description: true

srpm_build_deps:
  - jq
  - make
  - nodejs-npm

actions:
  post-upstream-clone:
    - make cockpit-cron.spec
  create-archive: make dist
  # Keep the Packit version in sync with the version used by make dist.
  get-current-version: make print-version

jobs:
  - job: tests
    trigger: pull_request
    # Pin the targets instead of fedora-all, and add new releases once they are
    # supported by COPR/Packit.
    targets: &test_targets
      - fedora-43
      - fedora-44
      - fedora-44-aarch64
      - fedora-45
      - fedora-45-aarch64
      - fedora-rawhide
      - centos-stream-9
      - centos-stream-9-aarch64
      - centos-stream-10

  - job: copr_build
    trigger: pull_request
    targets: *test_targets

  # Build published releases in the persistent Copr project. Keep these
  # targets aligned with the project's enabled chroots and the PR COPR job.
  - job: copr_build
    trigger: release
    identifier: published
    owner: yash
    project: cockpit-plugins
    targets:
      - fedora-43
      - fedora-43-aarch64
      - fedora-44
      - fedora-44-aarch64
      - fedora-45
      - fedora-45-aarch64
      - fedora-rawhide
      - fedora-rawhide-aarch64
      - centos-stream-9
      - centos-stream-9-aarch64
      - centos-stream-10
      - centos-stream-10-aarch64

  # Build releases in Fedora: https://packit.dev/docs/configuration/#propose_downstream
  #- job: propose_downstream
