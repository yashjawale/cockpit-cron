# Build all release artifacts on every push of a version tag (e.g. "123"),
# then create the GitHub release only after every package build succeeds.
# See README.md.
#
# Can also be triggered manually (Actions → release → Run workflow). Manual
# runs build and upload artifacts to the workflow run, but never publish.
name: release
on:
  push:
    tags:
      # this is a glob, not a regexp
      - '[0-9]*'
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cockpit-project/tasks:latest
      options: --user root
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # https://github.blog/2022-04-12-git-security-vulnerability-announced/
      - name: Pacify git's permission check
        run: git config --global --add safe.directory /__w/cockpit-cron/cockpit-cron

      - name: Build release
        run: |
          make dist
          make node-cache

      - name: Upload source artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: cockpit-cron-*.tar.xz
          if-no-files-found: error
          retention-days: 1

  # Build a Debian binary package from the release tarball. The tarball ships
  # the pre-built dist/ bundle and debian/ packaging, so no Node toolchain is
  # needed here.
  debian:
    runs-on: ubuntu-latest
    needs: source
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper gettext dpkg-dev xz-utils

      - name: Download source artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Build Debian package
        run: |
          tar -xf cockpit-cron-[0-9]*.tar.xz
          cd cockpit-cron
          dpkg-buildpackage -b -us -uc

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: ./*.deb
          if-no-files-found: error
          retention-days: 1

  # Build an RPM from the release tarball. On CentOS Stream the pre-built
  # dist/ bundle is used; the node-cache archive is still the spec's Source1.
  rpm:
    runs-on: ubuntu-latest
    needs: source
    container:
      image: quay.io/centos/centos:stream10
    steps:
      - name: Install build dependencies
        # gh is only in EPEL, not the CentOS Stream base repos
        run: dnf install -y epel-release && dnf install -y rpm-build make gettext libappstream-glib git

      - name: Download source artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Build RPM
        run: |
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS
          cp *.tar.xz ~/rpmbuild/SOURCES/
          tar -xf cockpit-cron-[0-9]*.tar.xz cockpit-cron/cockpit-cron.spec
          cp cockpit-cron/cockpit-cron.spec ~/rpmbuild/SPECS/
          cd ~/rpmbuild
          rpmbuild -bb SPECS/cockpit-cron.spec

      - name: Upload RPM package artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: ~/rpmbuild/RPMS/noarch/*.rpm
          if-no-files-found: error
          retention-days: 1

  # Build the Arch package recipe from the same source tarball. AUR itself
  # hosts recipes rather than binary packages; this verifies the recipe/build
  # before allowing the GitHub release to publish.
  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    needs: source
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed gettext

      - name: Download source artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Build Arch package
        run: |
          set -euo pipefail
          tarball=$(find release-assets -maxdepth 1 -name 'cockpit-cron-[0-9]*.tar.xz' -print -quit)
          test -n "${tarball}"
          mkdir package
          tar -xf "${tarball}" -C package
          cd package/cockpit-cron
          cp packaging/arch/PKGBUILD ./PKGBUILD
          cp "${GITHUB_WORKSPACE}/${tarball}" .
          checksum=$(sha256sum "$(basename "${tarball}")" | cut -d ' ' -f 1)
          sed -i "s/sha256sums=('SKIP')/sha256sums=('${checksum}')/" PKGBUILD
          useradd --create-home builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          runuser -u builder -- makepkg --nodeps --noconfirm

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: package/cockpit-cron/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1

  # This publishing gate waits for all package jobs. Only this job can write
  # release assets; a failed/cancelled build cannot leave a partial release.
  publish:
    runs-on: ubuntu-latest
    needs: [source, debian, rpm, arch]
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.debian.result == 'success' && needs.rpm.result == 'success' && needs.arch.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - name: Download source artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Download Debian package
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: release-assets

      - name: Download RPM package
        uses: actions/download-artifact@v8
        with:
          name: rpm-package
          path: release-assets

      - name: Download Arch package
        uses: actions/download-artifact@v8
        with:
          name: arch-package
          path: release-assets

      - name: Checkout tag for annotated release notes
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${tag}" > release-notes.txt
          gh release create "${tag}" release-assets/* \
            --title "${tag}" \
            --notes-file release-notes.txt \
            --repo "${GITHUB_REPOSITORY}"

  # Manual dry runs intentionally stop after building and uploading workflow
  # artifacts. External distribution publishers can depend on `publish` later.
