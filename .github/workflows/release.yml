# Build all release artifacts on every push of a version tag (e.g. "123"),
# then create the GitHub release only after every package build succeeds.
# See README.md.
#
# Can also be triggered manually (Actions → release → Run workflow). Manual
# runs build and upload artifacts to the workflow run, but never publish.
name: release
on:
  push:
    tags:
      # this is a glob, not a regexp
      - '[0-9]*'
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cockpit-project/tasks:latest
      options: --user root
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # https://github.blog/2022-04-12-git-security-vulnerability-announced/
      - name: Pacify git's permission check
        run: git config --global --add safe.directory /__w/cockpit-cron/cockpit-cron

      - name: Validate release tag
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+(\.[0-9]+)*$ ]] || {
            echo "Release tags must be numeric (for example 1, 2, 3, or 1.2.3)" >&2
            exit 1
          }
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          [[ "$(git cat-file -t "$tag_ref")" == tag ]] || {
            echo "Release tag ${GITHUB_REF_NAME} must be annotated; lightweight tags are unsupported" >&2
            exit 1
          }
          [[ "$(git describe --exact-match --tags HEAD)" == "${GITHUB_REF_NAME}" ]] || {
            echo "HEAD is not exactly tagged with ${GITHUB_REF_NAME}" >&2
            exit 1
          }

      - name: Build release
        run: |
          make dist
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            test -f "cockpit-cron-${GITHUB_REF_NAME}.tar.xz" || {
              echo "Release archive version does not match tag ${GITHUB_REF_NAME}" >&2
              exit 1
            }
          fi

      - name: Upload source artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: cockpit-cron-*.tar.xz
          if-no-files-found: error
          retention-days: 1

  # Build a Debian binary package from the release tarball. The tarball ships
  # the pre-built dist/ bundle and debian/ packaging, so no Node toolchain is
  # needed here.
  debian:
    runs-on: ubuntu-latest
    needs: source
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper gettext dpkg-dev xz-utils

      - name: Download source artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Build Debian package
        run: |
          tar -xf cockpit-cron-[0-9]*.tar.xz
          cd cockpit-cron
          dpkg-buildpackage -b -us -uc

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: ./*.deb
          if-no-files-found: error
          retention-days: 1

  # Build an RPM from the release tarball using its pre-built dist/ bundle.
  rpm:
    runs-on: ubuntu-latest
    needs: source
    container:
      image: quay.io/centos/centos:stream10
    steps:
      - name: Install build dependencies
        # gh is only in EPEL, not the CentOS Stream base repos
        run: dnf install -y epel-release && dnf install -y rpm-build make gettext libappstream-glib git

      - name: Download source artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Build RPM
        run: |
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS
          cp *.tar.xz ~/rpmbuild/SOURCES/
          tar -xf cockpit-cron-[0-9]*.tar.xz cockpit-cron/cockpit-cron.spec
          cp cockpit-cron/cockpit-cron.spec ~/rpmbuild/SPECS/
          cd ~/rpmbuild
          rpmbuild -bb SPECS/cockpit-cron.spec

      - name: Upload RPM package artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: ~/rpmbuild/RPMS/noarch/*.rpm
          if-no-files-found: error
          retention-days: 1

  # Build the Arch package recipe from the same source tarball. AUR itself
  # hosts recipes rather than binary packages; this verifies the recipe/build
  # before allowing the GitHub release to publish.
  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    needs: source
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed gettext

      - name: Download source artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Build Arch package
        run: |
          set -euo pipefail
          tarball=$(find release-assets -maxdepth 1 -name 'cockpit-cron-[0-9]*.tar.xz' -print -quit)
          test -n "${tarball}"
          mkdir package
          tar -xf "${tarball}" -C package
          cd package/cockpit-cron
          cp packaging/arch/PKGBUILD ./PKGBUILD
          cp "${GITHUB_WORKSPACE}/${tarball}" .
          checksum=$(sha256sum "$(basename "${tarball}")" | cut -d ' ' -f 1)
          sed -i "s/sha256sums=('SKIP')/sha256sums=('${checksum}')/" PKGBUILD
          useradd --create-home builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          runuser -u builder -- makepkg --nodeps --noconfirm

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: package/cockpit-cron/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1

  # Upload the exact source artifacts from this run to OBS. workflow_dispatch
  # runs only assemble and publish a review artifact; only a pushed version tag
  # may write to OBS.
  obs:
    runs-on: ubuntu-latest
    needs: source
    permissions:
      contents: read
    env:
      OBS_PROJECT: home:yashjawale
      OBS_PACKAGE: cockpit-cron
    steps:
      - name: Checkout the release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download source artifacts from this run
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Install OBS upload tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osc dpkg-dev xz-utils

      - name: Prepare and validate OBS sources
        run: |
          set -euo pipefail
          mapfile -t releases < <(find release-assets -maxdepth 1 -type f -name 'cockpit-cron-[0-9]*.tar.xz' -print)
          [[ ${#releases[@]} -eq 1 ]] || {
            echo "Expected exactly one versioned source tarball; found ${#releases[@]}" >&2
            exit 1
          }
          release="${releases[0]}"
          filename=$(basename "$release")
          [[ "$filename" =~ ^cockpit-cron-([0-9]([A-Za-z0-9.+~]*[0-9A-Za-z])?)\.tar\.xz$ ]] || {
            echo "Unexpected release source filename: $filename" >&2
            exit 1
          }
          version="${BASH_REMATCH[1]}"
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+(\.[0-9]+)*$ ]] || {
              echo "OBS publishing requires a numeric release tag (for example 27 or 1.2.3)" >&2
              exit 1
            }
            [[ "${GITHUB_REF_NAME}" == "$version" ]] || {
              echo "Tag ${GITHUB_REF_NAME} does not match archive version ${version}" >&2
              exit 1
            }
          fi
          mkdir -p "${RUNNER_TEMP}/obs-sources"
          packaging/obs/prepare-sources "$release" "${RUNNER_TEMP}/obs-sources"
          grep -Fxq "Version: ${version}" "${RUNNER_TEMP}/obs-sources/cockpit-cron.spec"
          test -f "${RUNNER_TEMP}/obs-sources/cockpit-cron_${version}-1.dsc"
          test -f "${RUNNER_TEMP}/obs-sources/cockpit-cron_${version}-1.debian.tar.xz"
          test -f "${RUNNER_TEMP}/obs-sources/cockpit-cron_${version}.orig.tar.xz"
          ls -lh "${RUNNER_TEMP}/obs-sources"

      - name: Save dry-run sources for review
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: obs-sources-dry-run
          path: ${{ runner.temp }}/obs-sources/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload release sources to OBS
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          set -euo pipefail
          : "${OBS_USER:?Add OBS_USER as a GitHub Actions secret}"
          : "${OBS_PASSWORD:?Add OBS_PASSWORD as a GitHub Actions secret}"

          config_dir=$(mktemp -d "${RUNNER_TEMP}/osc-config.XXXXXX")
          trap 'rm -rf "$config_dir"' EXIT
          export OSC_CONFIG="$config_dir/oscrc"
          python3 - <<'PY'
          import configparser
          import os

          api = "https://api.opensuse.org"
          config = configparser.ConfigParser(interpolation=None)
          config["general"] = {"apiurl": api}
          config[api] = {"user": os.environ["OBS_USER"], "pass": os.environ["OBS_PASSWORD"]}
          with open(os.environ["OSC_CONFIG"], "w", encoding="utf-8") as stream:
              config.write(stream)
          os.chmod(os.environ["OSC_CONFIG"], 0o600)
          PY

          osc_cmd() { osc --config "$OSC_CONFIG" "$@"; }
          cd "$RUNNER_TEMP"
          osc_cmd checkout "$OBS_PROJECT" "$OBS_PACKAGE"
          package_dir="$RUNNER_TEMP/$OBS_PROJECT/$OBS_PACKAGE"
          cd "$package_dir"

          # Replace only artifacts produced by this release helper; leave
          # unrelated maintainer files and history untouched.
          declare -A keep=()
          for file in "${RUNNER_TEMP}/obs-sources"/*; do
            keep["$(basename "$file")"]=1
          done
          for file in \
            cockpit-cron-[0-9]*.tar.xz \
            cockpit-cron-node-[0-9]*.tar.xz \
            cockpit-cron_[0-9]*.dsc \
            cockpit-cron_[0-9]*.orig.tar.xz \
            cockpit-cron_[0-9]*.debian.tar.xz; do
            [[ -f "$file" ]] || continue
            if [[ -n "${keep[$file]:-}" ]]; then
              continue
            fi
            osc_cmd delete "$file"
          done

          cp -f "${RUNNER_TEMP}/obs-sources/"* .
          git -C "$GITHUB_WORKSPACE" tag -l --format='%(contents:body)' \
            "${GITHUB_REF_NAME}" > "$RUNNER_TEMP/release-notes.txt"
          python3 "$GITHUB_WORKSPACE/packaging/obs/update-changes.py" \
            --file cockpit-cron.changes \
            --tag "${GITHUB_REF_NAME}" \
            --notes "$RUNNER_TEMP/release-notes.txt"

          status=$(osc_cmd status)
          while read -r state file; do
            [[ "$state" == '?' ]] && osc_cmd add "$file"
          done <<< "$status"
          status=$(osc_cmd status)
          if [[ -z "$status" ]]; then
            echo "OBS already contains this release; nothing to commit."
            exit 0
          fi
          printf '%s\n' "$status"
          osc_cmd commit -m "Update to ${GITHUB_REF_NAME}"

  # Upload signed source packages to the shared Launchpad PPA. Launchpad builds
  # the binary packages for each Ubuntu series; this job only runs for tags.
  ppa:
    runs-on: ubuntu-latest
    needs: source
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu-series: [jammy, noble, resolute, stonking]
    steps:
      - name: Checkout tagged source for packaging helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Install packaging and upload tools
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts dpkg-dev dput gettext debhelper xz-utils

      - name: Download release source artifact
        uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Prepare and sign source package
        env:
          PPA_SIGNING_KEY_ASC: ${{ secrets.PPA_SIGNING_KEY_ASC }}
          PPA_SIGNING_FINGERPRINT: ${{ secrets.PPA_SIGNING_FINGERPRINT }}
          PPA_SIGNING_PASSPHRASE: ${{ secrets.PPA_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+(\.[0-9]+)*$ ]] || {
            echo "PPA publishing requires a numeric release tag (for example 27 or 1.2.3)" >&2
            exit 1
          }
          : "${PPA_SIGNING_KEY_ASC:?Set PPA_SIGNING_KEY_ASC in repository Actions secrets}"
          : "${PPA_SIGNING_FINGERPRINT:?Set PPA_SIGNING_FINGERPRINT in repository Actions secrets}"
          : "${PPA_SIGNING_PASSPHRASE:?Set PPA_SIGNING_PASSPHRASE in repository Actions secrets}"
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$PPA_SIGNING_KEY_ASC" | gpg --batch --import
          # Unlock the dedicated key into the ephemeral job's gpg-agent cache;
          # the passphrase is sent over stdin, not exposed as a process argument.
          printf '%s' "$PPA_SIGNING_PASSPHRASE" | \
            gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$PPA_SIGNING_FINGERPRINT" --detach-sign /dev/null
          work="${RUNNER_TEMP}/ppa-${{ matrix.ubuntu-series }}"
          mkdir -p "$work"
          mapfile -t source_tarballs < <(find . -maxdepth 1 -type f \
            -name 'cockpit-cron-[0-9]*.tar.xz' -print)
          [[ ${#source_tarballs[@]} -eq 1 ]] || {
            echo "Expected exactly one versioned release tarball; found ${#source_tarballs[@]}" >&2
            exit 1
          }
          filename=$(basename "${source_tarballs[0]}")
          [[ "$filename" =~ ^cockpit-cron-([0-9]([A-Za-z0-9.+~]*[0-9A-Za-z])?)\.tar\.xz$ && \
             "${BASH_REMATCH[1]}" == "${GITHUB_REF_NAME}" ]] || {
            echo "Release archive ${filename} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          }
          packaging/debian/prepare-ppa-source "${source_tarballs[0]}" \
            "${{ matrix.ubuntu-series }}" "$work"
          cd "$work"/cockpit-cron-*
          dpkg-buildpackage -S -sa -k"${PPA_SIGNING_FINGERPRINT}"
          changes=$(find .. -maxdepth 1 -name '*_source.changes' -print -quit)
          test -n "$changes"
          dput "ppa:yashjawale/cockpit-plugins" "$changes"

  # This publishing gate waits for all package jobs. Only this job can write
  # release assets; a failed/cancelled build cannot leave a partial release.
  publish:
    runs-on: ubuntu-latest
    needs: [source, debian, rpm, arch]
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.debian.result == 'success' && needs.rpm.result == 'success' && needs.arch.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - name: Download source artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Download Debian package
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: release-assets

      - name: Download RPM package
        uses: actions/download-artifact@v8
        with:
          name: rpm-package
          path: release-assets

      - name: Download Arch package
        uses: actions/download-artifact@v8
        with:
          name: arch-package
          path: release-assets

      - name: Checkout tag for annotated release notes
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${tag}" > release-notes.txt
          gh release create "${tag}" release-assets/* \
            --title "${tag}" \
            --notes-file release-notes.txt \
            --repo "${GITHUB_REPOSITORY}"

  # Manual dry runs intentionally stop after building and uploading workflow
  # artifacts. External distribution publishers can depend on `publish` later.
